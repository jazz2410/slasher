[package]
name = "slasher"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"

# Bevy is unusably slow when its dependencies are built unoptimized, but we
# still want fast rebuilds of our own code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]
# `cargo run --features dev` links Bevy dynamically for much faster rebuilds.
# Never ship a release build with this on.
dev = ["bevy/dynamic_linking"]
